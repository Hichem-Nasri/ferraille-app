server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 40m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml application/manifest+json;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ^~ /api/ {
        proxy_pass http://backend:8080;
    }

    location ^~ /uploads/ {
        proxy_pass http://backend:8080;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = / {
        rewrite ^ /seo/home break;
        proxy_pass http://backend:8080;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa;
    }

    location ~ ^/(piece/|pieces/|casse/|casses(/|$)|demandes$) {
        rewrite ^(.*)$ /seo$1 break;
        proxy_pass http://backend:8080;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa;
    }

    location = /sitemap.xml {
        rewrite ^ /seo/sitemap.xml break;
        proxy_pass http://backend:8080;
    }

    location = /robots.txt {
        rewrite ^ /seo/robots.txt break;
        proxy_pass http://backend:8080;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:js|css|woff2?|png|svg|webp|jpg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location @spa {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
