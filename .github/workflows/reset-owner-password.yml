name: Réinitialiser le mot de passe propriétaire

on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Appliquer OWNER_PASSWORD au compte propriétaire
        uses: appleboy/ssh-action@v1.0.3
        env:
          NEW_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: NEW_PASSWORD
          script: |
            set -e
            [ ${#NEW_PASSWORD} -ge 8 ] || { echo "OWNER_PASSWORD doit faire au moins 8 caractères"; exit 1; }
            cd /opt/ferraille
            printf '%s' "$NEW_PASSWORD" | docker compose exec -T db sh -c '
              PW=$(cat)
              psql -U ferraille -d ferraille -v ON_ERROR_STOP=1 -v pw="$PW" <<SQL
            create extension if not exists pgcrypto;
            update users set password_hash = crypt(:'"'"'pw'"'"', gen_salt('"'"'bf'"'"', 10))
             where lower(email) = '"'"'nasri.hichem.pro@gmail.com'"'"';
            SQL'
            echo "Mot de passe mis à jour"
