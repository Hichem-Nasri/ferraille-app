name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify
        working-directory: backend

  images:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Registry name
        run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/ferraille-api:latest,${{ env.REGISTRY }}/ferraille-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/ferraille-web:latest,${{ env.REGISTRY }}/ferraille-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    env:
      HAS_VPS: ${{ secrets.VPS_HOST != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Pas de serveur configuré
        if: env.HAS_VPS != 'true'
        run: echo "::notice::Ajoute les secrets VPS_HOST, VPS_USER et VPS_PASSWORD (ou VPS_SSH_KEY) pour activer le déploiement."
      - name: Copier la configuration sur le serveur
        if: env.HAS_VPS == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: docker-compose.yml,deploy/Caddyfile
          target: ${{ vars.DEPLOY_DIR || '/opt/ferraille' }}
      - name: Déployer
        if: env.HAS_VPS == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            mkdir -p ${{ vars.DEPLOY_DIR || '/opt/ferraille' }}
            cd ${{ vars.DEPLOY_DIR || '/opt/ferraille' }}
            if [ ! -f .env ]; then
              umask 077
              {
                echo "WEB_PORT=${{ vars.WEB_PORT || '8090' }}"
                echo "PUBLIC_URL=${{ vars.PUBLIC_URL || format('http://{0}:{1}', secrets.VPS_HOST, vars.WEB_PORT || '8090') }}"
                echo "DB_PASSWORD=$(openssl rand -hex 24)"
                echo "JWT_SECRET=$(openssl rand -hex 48)"
                echo "DEMO_DATA=true"
                echo "OWNER_PASSWORD=${{ secrets.OWNER_PASSWORD }}"
                echo "ADMIN_EMAIL=${{ vars.ADMIN_EMAIL }}"
                echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}"
              } > .env
              echo "Fichier .env créé avec des secrets générés"
            fi
            upsert() { [ -n "$2" ] || return 0; if grep -q "^$1=" .env; then sed -i "s|^$1=.*|$1=$2|" .env; else echo "$1=$2" >> .env; fi; }
            upsert FACEBOOK_APP_ID '${{ vars.FACEBOOK_APP_ID }}'
            upsert FACEBOOK_APP_SECRET '${{ secrets.FACEBOOK_APP_SECRET }}'
            upsert FACEBOOK_GROUP_URL '${{ vars.FACEBOOK_GROUP_URL }}'
            REGISTRY="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            export REGISTRY TAG='${{ github.sha }}'
            docker compose pull backend frontend
            docker compose up -d --no-build --remove-orphans
            docker image prune -f
            PORT=$(grep -E '^WEB_PORT=' .env | cut -d= -f2); PORT=${PORT:-8090}
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$PORT/api/listings?size=1" || true)
              [ "$code" = "200" ] && break
              sleep 5
            done
            docker compose ps
            echo "--- Vérification ---"
            for path in "/" "/api/listings?size=1" "/pieces/moteur" "/sitemap.xml" "/robots.txt" "/casses" "/demandes" "/api/vehicles" "/api/casses" "/api/requests"; do
              echo "$path -> $(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$PORT$path")"
            done
            curl -s "http://localhost:$PORT/api/listings?size=50" | grep -o '"totalElements":[0-9]*' || true
            curl -s "http://localhost:$PORT/" | grep -o '<title>[^<]*</title>' || true
            docker compose logs --tail=300 backend | grep -iE "mot de passe provisoire|ERROR|Started FerrailleApplication" | tail -15 || true
            [ "$code" = "200" ] || { echo "L'API ne répond pas"; docker compose logs --tail=80 backend; exit 1; }
            docker logout ghcr.io
