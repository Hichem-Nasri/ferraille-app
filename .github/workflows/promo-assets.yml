name: Promo assets

on:
  workflow_dispatch:
    inputs:
      count:
        description: Nombre d'annonces récentes
        default: "12"

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les annonces récentes et leurs photos
        env:
          COUNT: ${{ inputs.count }}
        run: |
          mkdir -p out/photos
          curl -fsS "https://ferraille-tn.com/api/listings?sort=recent&size=${COUNT}" -o list.json
          for id in $(jq -r '.content[].id' list.json); do
            curl -fsS "https://ferraille-tn.com/api/listings/$id" \
              | jq '{id, slug, title, description, price, negotiable, category, condition, city, oemReference, photos, fits, createdAt, sellerId: .seller.id, sellerName: .seller.displayName, sellerType: .seller.sellerType}' > out/$id.json
            n=0
            for p in $(jq -r '.photos[]' out/$id.json); do
              n=$((n+1))
              ext="${p##*.}"
              curl -fsS "https://ferraille-tn.com$p" -o "out/photos/${id}_${n}.${ext}" || true
            done
            jq -r '"\(.id) | seller \(.sellerId) | \(.createdAt) | \(.title)"' out/$id.json
          done
      - name: Publier sur la branche promo-assets
        run: |
          cd out
          git init -q -b promo-assets
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Assets promo"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" promo-assets
