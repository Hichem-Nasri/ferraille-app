name: Statistiques

on:
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Compter les inscriptions et les annonces
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /opt/ferraille
            docker compose exec -T db psql -U ferraille -d ferraille -A -F ' | ' -c "
              select 'comptes_total', count(*) from users
              union all select 'comptes_reels (hors demo et admin)', count(*) from users where coalesce(email,'') not like '%@demo.ferraille.tn' and role <> 'ADMIN' and full_name <> 'Compte supprimé'
              union all select 'dont connectes Facebook', count(*) from users where facebook_id is not null
              union all select 'dont avec contact (WhatsApp ou tel)', count(*) from users where coalesce(whatsapp,'') <> '' or coalesce(phone,'') <> ''
              union all select 'dont casses / pro', count(*) from users where seller_type = 'PRO' and coalesce(email,'') not like '%@demo.ferraille.tn'
              union all select 'inscrits aujourd''hui', count(*) from users where created_at >= date_trunc('day', now())
              union all select 'inscrits 7 derniers jours', count(*) from users where created_at >= now() - interval '7 days'
              union all select 'comptes supprimes', count(*) from users where full_name = 'Compte supprimé'
              union all select 'annonces en ligne', count(*) from listings where status = 'ACTIVE'
              union all select 'annonces en ligne (vendeurs reels)', count(*) from listings l join users u on u.id = l.seller_id where l.status = 'ACTIVE' and coalesce(u.email,'') not like '%@demo.ferraille.tn'
              union all select 'vues totales', coalesce(sum(views),0) from listings
              union all select 'clics contact totaux', coalesce(sum(contact_clicks),0) from listings;"
            echo "--- Inscriptions par jour ---"
            docker compose exec -T db psql -U ferraille -d ferraille -A -F ' | ' -c "select to_char(created_at at time zone 'Africa/Tunis','YYYY-MM-DD') jour, count(*) from users where coalesce(email,'') not like '%@demo.ferraille.tn' and role <> 'ADMIN' group by 1 order by 1 desc limit 14;"
