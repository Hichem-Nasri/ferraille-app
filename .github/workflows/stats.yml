name: Statistiques

on:
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Compter les inscriptions et les annonces
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /opt/ferraille
            docker compose exec -T db psql -U ferraille -d ferraille -A -F ' | ' -c "
              select 'comptes_total', count(*) from users
              union all select 'comptes_reels (hors demo et admin)', count(*) from users where coalesce(email,'') not like '%@demo.ferraille.tn' and role <> 'ADMIN' and full_name <> 'Compte supprimé'
              union all select 'dont connectes Facebook', count(*) from users where facebook_id is not null
              union all select 'dont avec contact (WhatsApp ou tel)', count(*) from users where coalesce(whatsapp,'') <> '' or coalesce(phone,'') <> ''
              union all select 'dont casses / pro', count(*) from users where seller_type = 'PRO' and coalesce(email,'') not like '%@demo.ferraille.tn'
              union all select 'inscrits aujourd''hui', count(*) from users where created_at >= date_trunc('day', now())
              union all select 'inscrits 7 derniers jours', count(*) from users where created_at >= now() - interval '7 days'
              union all select 'comptes supprimes', count(*) from users where full_name = 'Compte supprimé'
              union all select 'annonces en ligne', count(*) from listings where status = 'ACTIVE'
              union all select 'annonces en ligne (vendeurs reels)', count(*) from listings l join users u on u.id = l.seller_id where l.status = 'ACTIVE' and coalesce(u.email,'') not like '%@demo.ferraille.tn'
              union all select 'vues totales', coalesce(sum(views),0) from listings
              union all select 'clics contact totaux', coalesce(sum(contact_clicks),0) from listings
              union all select 'demandes de pieces (total)', count(*) from part_requests
              union all select 'demandes ouvertes', count(*) from part_requests where status = 'OPEN'
              union all select 'personnes ayant fait une demande', count(distinct user_id) from part_requests
              union all select 'demandes aujourd''hui', count(*) from part_requests where created_at >= date_trunc('day', now())
              union all select 'alertes creees', count(*) from saved_searches
              union all select 'avis laisses', count(*) from reviews
              union all select 'messages acheteurs (total)', count(*) from messages
              union all select 'messages 7 derniers jours', count(*) from messages where created_at >= now() - interval '7 days'
              union all select 'contacts dates (total)', count(*) from contact_events
              union all select 'contacts dates aujourd''hui', count(*) from contact_events where created_at >= date_trunc('day', now());"
            docker compose exec -T db psql -U ferraille -d ferraille -A -F ' | ' -c "select channel, count(*) from contact_events group by 1 order by 2 desc;"
            docker compose logs --since 3h backend 2>&1 | grep -E " ERROR " | tail -8 | cut -c1-300 | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/[email]/g; s/[0-9]{8,}/[num]/g'
            echo "--- Hier (heure de Tunis) ---"
            docker compose exec -T db psql -U ferraille -d ferraille -A -F ' | ' -c "
              with b as (select (date_trunc('day', now() at time zone 'Africa/Tunis') - interval '1 day') at time zone 'Africa/Tunis' as d0,
                                 date_trunc('day', now() at time zone 'Africa/Tunis') at time zone 'Africa/Tunis' as d1)
              select 'visiteurs', count(distinct visitor) from page_visits, b where created_at >= d0 and created_at < d1
              union all select 'pages vues', count(*) from page_visits, b where created_at >= d0 and created_at < d1
              union all select 'visiteurs fiches pieces', count(distinct visitor) from page_visits, b where created_at >= d0 and created_at < d1 and path like '/piece/%'
              union all select 'inscriptions', count(*) from users, b where created_at >= d0 and created_at < d1 and role <> 'ADMIN'
              union all select 'annonces publiees', count(*) from listings, b where created_at >= d0 and created_at < d1
              union all select 'demandes de pieces', count(*) from part_requests, b where created_at >= d0 and created_at < d1
              union all select 'contacts (clics + messages)', count(*) from contact_events, b where created_at >= d0 and created_at < d1
              union all select 'messages acheteurs', count(*) from messages, b where created_at >= d0 and created_at < d1;"
            docker compose exec -T db psql -U ferraille -d ferraille -A -F ' | ' -c "
              with b as (select (date_trunc('day', now() at time zone 'Africa/Tunis') - interval '1 day') at time zone 'Africa/Tunis' as d0,
                                 date_trunc('day', now() at time zone 'Africa/Tunis') at time zone 'Africa/Tunis' as d1)
              select 'source: ' || coalesce(nullif(referrer,''),'direct'), count(distinct visitor) from page_visits, b
              where created_at >= d0 and created_at < d1 group by 1 order by 2 desc limit 8;"
            echo "--- Demandes par marque ---"
            docker compose exec -T db psql -U ferraille -d ferraille -A -F ' | ' -c "select make, count(*) from part_requests group by 1 order by 2 desc limit 15;"
            echo "--- Inscriptions par jour ---"
            docker compose exec -T db psql -U ferraille -d ferraille -A -F ' | ' -c "select to_char(created_at at time zone 'Africa/Tunis','YYYY-MM-DD') jour, count(*) from users where coalesce(email,'') not like '%@demo.ferraille.tn' and role <> 'ADMIN' group by 1 order by 1 desc limit 14;"
