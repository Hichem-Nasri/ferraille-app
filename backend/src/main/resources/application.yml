server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: ferraille-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ferraille}
    username: ${DB_USER:ferraille}
    password: ${DB_PASSWORD:ferraille}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 40MB
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info

ferraille:
  commission-rate: ${COMMISSION_RATE:0.10}
  protection-fee: ${PROTECTION_FEE:4.000}
  cash-on-delivery-fee: ${COD_FEE:2.000}
  auto-confirm-hours: ${AUTO_CONFIRM_HOURS:48}
  upload-dir: ${UPLOAD_DIR:./uploads}
  demo-data: ${DEMO_DATA:false}
  cors-origins: ${CORS_ORIGINS:http://localhost:4200}
  admin-email: ${ADMIN_EMAIL:}
  admin-password: ${ADMIN_PASSWORD:}
  owner-password: ${OWNER_PASSWORD:}
  public-url: ${PUBLIC_URL:http://localhost}
  frontend-index-url: ${FRONTEND_INDEX_URL:http://frontend/index.html}
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-change-me-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:10080}
  shipping:
    ARAMEX:
      label: Aramex
      fee: ${ARAMEX_FEE:8.000}
      min-days: 1
      max-days: 2
    LA_POSTE:
      label: La Poste · Rapid-Poste
      fee: ${LAPOSTE_FEE:7.000}
      min-days: 2
      max-days: 3
